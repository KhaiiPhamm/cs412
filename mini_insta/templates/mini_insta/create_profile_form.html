{% extends "mini_insta/base.html" %}

{% block content %}
<main class="form-page">
    <h1>Create Profile</h1>

    <form method="post" action="{% url 'create_profile' %}">
        {% csrf_token %}
        <table>
            {{ user_form.as_table }}
            {{ form.as_table }}
        </table>
        <div class="form-actions">
            <button type="submit">Create Profile</button>
        </div>
    </form>
</main>
{% endblock %}
