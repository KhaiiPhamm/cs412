{% load static %}
<html>

<head>
    <title>Mini Insta</title>
    <link rel="stylesheet" href="{% static 'mini_insta/style.css' %}">
</head>

<body>
    {% block content %}
    {% endblock %}

    <footer>
        <a href="{% url 'show_all_profiles' %}">Show All</a>
        {% if request.user.is_authenticated %}
        <a href="{% url 'show_my_profile' %}">Profile</a>
        <a href="{% url 'show_feed' %}">Home</a>
        <a href="{% url 'search' %}">Search</a>
        <a href="{% url 'create_post' %}">Create Post</a>
        <form method="post" action="{% url 'logout' %}" class="logout-form">
            {% csrf_token %}
            <button type="submit">Log out</button>
        </form>
        {% else %}
        <a href="{% url 'login' %}">Log in</a>
        <a href="{% url 'create_profile' %}">Create Profile</a>
        {% endif %}
    </footer>
</body>

</html>
