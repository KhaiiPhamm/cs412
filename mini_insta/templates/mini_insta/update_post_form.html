{% extends "mini_insta/base.html" %}

{% block content %}
<main class="form-page">
    <h1>Update Post</h1>

    <div class="form-actions">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save changes</button>
        </form>

        <form method="get" action="{% url 'show_post' object.pk %}">
            <button type="submit">Cancel</button>
        </form>
    </div>
</main>
{% endblock %}
