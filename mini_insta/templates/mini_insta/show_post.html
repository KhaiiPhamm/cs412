<!---show_post.html-->
{% extends 'mini_insta/base.html' %}

{% block content %}
<h1>Showing Post</h1>
<main class="post-page">
    <div class="post-photos">
        {% for photo in post.get_all_photos %}
            {% if photo.get_image_url %}
            <img src="{{ photo.get_image_url }}" alt="Photo by {{ post.profile.username }}">
            {% else %}
            <img src="https://mmt-am.com/wp-content/uploads/2022/12/no_Image.jpg" alt="No photo available">
            {% endif %}
        {% empty %}
            <img src="https://mmt-am.com/wp-content/uploads/2022/12/no_Image.jpg" alt="No photo available">
        {% endfor %}
    </div>
    <p class="post-caption">{{ post.caption }}</p>
    <p class="post-timestamp">{{ post.timestamp}}</p>
</main>
{% endblock %}
