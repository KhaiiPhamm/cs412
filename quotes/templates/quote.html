{% extends 'base.html' %}

{% block content %}
<div class="content">
    <header>
        <h1>Nelson Mandela Quote of the Day</h1>
    </header>
    <h3>{{ quote }}</h3>
    <img src="{{ image }}" alt="Picture of Nelson Mandela">
</div>

{% endblock %}
