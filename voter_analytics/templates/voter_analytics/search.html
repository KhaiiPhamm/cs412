    Description: Template for displaying voters search.
--><h1>Search Form</h1>

<form method="get">
<table>

    <tr>
        <th>Party Affiliation:</th>
        <td>
            <select name="party_aff">
                <option value="">Any</option>
                {% for p in parties %}
                <option value="{{ p }}" {% if request.GET.party_aff == p %}selected{% endif %}>{{ p }}</option>
                {% endfor %}
            </select>
        </td>

        <th>Min DOB:</th>
        <td>
            <select name="min_dob">
                <option value="">Any</option>
                {% for y in years %}
                <option value="{{ y }}" {% if request.GET.min_dob == y|stringformat:"s" %}selected{% endif %}>{{ y }}</option>
                {% endfor %}
            </select>
        </td>

        <th>Max DOB:</th>
        <td>
            <select name="max_dob">
                <option value="">Any</option>
                {% for y in years %}
                <option value="{{ y }}" {% if request.GET.max_dob == y|stringformat:"s" %}selected{% endif %}>{{ y }}</option>
                {% endfor %}
            </select>
        </td>

        <th>Voter Score:</th>
        <td>
            <select name="voter_score">
                <option value="">Any</option>
                {% for s in scores %}
                <option value="{{ s }}" {% if request.GET.voter_score == s|stringformat:"s" %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </td>
    </tr>

    <tr>
        <th>Voted in:</th>
        <td colspan="7">
            <label><input type="checkbox" name="v20state" {% if request.GET.v20state %}checked{% endif %}> 2020 State</label>
            <label><input type="checkbox" name="v21town" {% if request.GET.v21town %}checked{% endif %}> 2021 Town</label>
            <label><input type="checkbox" name="v21primary" {% if request.GET.v21primary %}checked{% endif %}> 2021 Primary</label>
            <label><input type="checkbox" name="v22general" {% if request.GET.v22general %}checked{% endif %}> 2022 General</label>
            <label><input type="checkbox" name="v23town" {% if request.GET.v23town %}checked{% endif %}> 2023 Town</label>
        </td>
    </tr>

    <tr>
        <td><input type="submit" value="Filter"></td>
        <td></td>
    </tr>

</table>
</form>
