{% extends 'dadjokes/base.html' %}

{% block content %}
<h1>Random Dad Joke</h1>
<div class="card">
    {% if joke %}
    <p>{{ joke.text }}</p>
    <p>Contributed by {{ joke.name }} on {{ joke.timestamp }}</p>
    {% endif %}
</div>

<div class="card">
    {% if picture %}
    <img src="{{ picture.image_url }}" alt="Silly picture" />
    <p>Contributed by {{ picture.name }}</p>
    {% endif %}
</div>
{% endblock %}
