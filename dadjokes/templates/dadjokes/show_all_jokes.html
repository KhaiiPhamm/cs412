{% extends 'dadjokes/base.html' %}

{% block content %}
<h1>All Dad Jokes</h1>

{% for joke in jokes %}
<div class="card">
    <p>{{ joke.text }}</p>
    <p><em>Contributed by {{ joke.name }} on {{ joke.timestamp }}</em></p>
    <a href="{% url 'show_joke' joke.pk %}">View this joke</a>
</div>
<hr>
{% endfor %}
{% endblock %}
