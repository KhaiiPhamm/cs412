{% extends 'dadjokes/base.html' %}

{% block content %}
<h1>Dad Joke</h1>
<div class="card">
    <p>{{ joke.text }}</p>
    <p><em>Contributed by {{ joke.name }} on {{ joke.timestamp }}</em></p>
</div>
{% endblock %}
